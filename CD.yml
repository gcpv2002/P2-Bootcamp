trigger:
  branches:
    include:
      - main

  paths:
    include:
      - Manifest

pool:
  name: Default

stages:
  - stage: DeployApplication
    displayName: 'Deploying Application'
    jobs:
      - job: Deploy
        displayName: 'Deploy'
        steps:
          - task: KubectlInstaller@0
            inputs:
              kubectlVersion: 'latest'

          - task: Kubernetes@1
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: 'Kubernetes connection'
              command: 'apply'
              useConfigurationFile: true
              configuration: 'Manifest/Deployment.yaml'
              secretType: 'dockerRegistry'
              containerRegistryType: 'Azure Container Registry'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Manifest'

          - task: Kubernetes@1
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: 'Kubernetes connection'
              command: 'apply'
              useConfigurationFile: true
              configuration: 'Manifest/Service.yaml'
              secretType: 'dockerRegistry'
              containerRegistryType: 'Azure Container Registry'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Manifest'
